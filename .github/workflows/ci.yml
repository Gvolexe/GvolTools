name: CI

on:
  push:
    branches: [main, master, dev/v1]
  pull_request:
    branches: [main, master, dev/v1]

env:
  PYTHONDONTWRITEBYTECODE: 1
  NO_COLOR: 1

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov paramiko cryptography
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Validate setup.json files
        run: |
          echo "Validating all setup.json files..."
          for f in tools/*/setup.json; do
            python -c "import json; json.load(open('$f'))" || exit 1
            echo "  ✓ $f"
          done
          echo "All setup.json files are valid JSON"

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov-report=xml --cov-report=term-missing

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          find tools -name "*.py" -path "*/files/*" | while read f; do
            python -m py_compile "$f" || exit 1
            echo "  ✓ $f"
          done
          echo "All Python files have valid syntax"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          ruff check tools/*/files/ --ignore E501,E722,F841 --exclude "*.pyc"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "tests .venv .git tools"

  # ─────────────────────────────────────────────────────────────────────────────
  # Ubuntu/Debian Testing
  # ─────────────────────────────────────────────────────────────────────────────

  test-ubuntu:
    name: Test on Ubuntu ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["22.04", "24.04"]
    container:
      image: ubuntu:${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            apt-get update && apt-get install -y --fix-missing python3 python3-pip python3-paramiko && break
            echo "Retry $i..."
            sleep 5
          done
          python3 -m pip install --break-system-packages pytest cryptography || \
          python3 -m pip install pytest cryptography

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test installer list
        run: ./installgvtools.sh list

      - name: Install gvcore
        run: ./installgvtools.sh install gvcore

      - name: Install all tools
        run: ./installgvtools.sh install-all

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for tool in gv gvfleet gvsshprofile gvolkeymanager; do
            if [ -f "$HOME/.local/bin/$tool" ]; then
              echo "✓ $tool installed"
            else
              echo "✗ $tool missing"
              exit 1
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Debian Testing
  # ─────────────────────────────────────────────────────────────────────────────

  test-debian:
    name: Test on Debian ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["11", "12"]
    container:
      image: debian:${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            apt-get update && apt-get install -y --fix-missing python3 python3-pip python3-paramiko && break
            echo "Retry $i..."
            sleep 5
          done
          python3 -m pip install --break-system-packages pytest cryptography 2>/dev/null || \
          python3 -m pip install pytest cryptography

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test installer
        run: ./installgvtools.sh list

      - name: Install all tools
        run: |
          ./installgvtools.sh install gvcore
          ./installgvtools.sh install-all

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gv --version

  # ─────────────────────────────────────────────────────────────────────────────
  # Fedora/RHEL Testing
  # ─────────────────────────────────────────────────────────────────────────────

  test-fedora:
    name: Test on Fedora ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["39", "40"]
    container:
      image: fedora:${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y python3 python3-pip python3-paramiko python3-cryptography

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test installer
        run: ./installgvtools.sh list

      - name: Install all tools
        run: |
          ./installgvtools.sh install gvcore
          ./installgvtools.sh install-all

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gv --version

  test-rocky:
    name: Test on Rocky Linux ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8", "9"]
    container:
      image: rockylinux:${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ "${{ matrix.version }}" = "8" ]; then
            # Rocky 8 needs Python 3.9+ from AppStream
            dnf install -y python39 python39-pip
            alternatives --set python3 /usr/bin/python3.9
            python3 -m pip install --upgrade pip
            python3 -m pip install paramiko cryptography
          else
            dnf install -y python3 python3-pip
            python3 -m pip install paramiko cryptography
          fi

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test installer
        run: ./installgvtools.sh list

      - name: Install all tools
        run: |
          ./installgvtools.sh install gvcore
          ./installgvtools.sh install-all

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gv --version

  # ─────────────────────────────────────────────────────────────────────────────
  # Arch Linux Testing
  # ─────────────────────────────────────────────────────────────────────────────

  test-arch:
    name: Test on Arch Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm python python-pip python-paramiko python-cryptography

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test installer
        run: ./installgvtools.sh list

      - name: Install all tools with deps
        run: |
          ./installgvtools.sh install gvcore
          ./installgvtools.sh install-all

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gv --version
          gvfleet --version

  # ─────────────────────────────────────────────────────────────────────────────
  # openSUSE Testing
  # ─────────────────────────────────────────────────────────────────────────────

  test-opensuse:
    name: Test on openSUSE
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          zypper --non-interactive install python3 python3-pip python3-paramiko python3-cryptography

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test installer
        run: ./installgvtools.sh list

      - name: Install all tools
        run: |
          ./installgvtools.sh install gvcore
          ./installgvtools.sh install-all

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gv --version

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests (after all distro tests pass)
  # ─────────────────────────────────────────────────────────────────────────────

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest paramiko cryptography

      - name: Install gvcore
        run: ./installgvtools.sh install gvcore

      - name: Install all tools
        run: ./installgvtools.sh install-all

      - name: Run integration tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python tests/test_integration.py
