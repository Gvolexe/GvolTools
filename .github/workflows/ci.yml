name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov paramiko
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=gvolkeymanager --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          ruff check gvolkeymanager/files/ --ignore E501

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "tests"

  installer-test:
    name: Test Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make installer executable
        run: chmod +x installgvtools.sh

      - name: Test list command
        run: ./installgvtools.sh list

      - name: Test help command
        run: ./installgvtools.sh --help

      - name: Test version command
        run: ./installgvtools.sh --version

      - name: Install tool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-paramiko
          ./installgvtools.sh install gvolkeymanager

      - name: Verify installation
        run: |
          hash -r
          ~/.local/bin/gvolkeymanager --version

      - name: Test status command
        run: ./installgvtools.sh status gvolkeymanager

      - name: Uninstall tool
        run: ./installgvtools.sh uninstall gvolkeymanager

      - name: Verify uninstallation
        run: |
          if [ -f ~/.local/bin/gvolkeymanager ]; then
            echo "Uninstall failed: file still exists"
            exit 1
          fi
          echo "Uninstall successful"
