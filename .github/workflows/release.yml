name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest paramiko cryptography

      - name: Validate all setup.json files
        run: |
          echo "Validating setup.json files..."
          for f in tools/*/setup.json; do
            python -c "import json; json.load(open('$f'))" || exit 1
            echo "  ✓ $f"
          done

      - name: Check version consistency
        run: |
          echo "Checking version consistency..."
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Release tag version: $TAG_VERSION"

          # Check gvcore.py version (single source of truth)
          GVCORE_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' tools/gvcore/files/gvcore.py)
          echo "gvcore.py version: $GVCORE_VERSION"
          if [ "$GVCORE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: gvcore.py version mismatch!"
            echo "Expected: $TAG_VERSION"
            echo "Found: $GVCORE_VERSION"
            exit 1
          fi

          echo "✓ Version $TAG_VERSION matches gvcore.py"

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        run: |
          # Count tools
          TOOL_COUNT=$(ls -d tools/*/setup.json 2>/dev/null | wc -l)

          echo "tool_count=$TOOL_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          body: |
            ## GVTools ${{ github.ref_name }}

            ### Installation

            **From Source:**
            ```bash
            git clone https://github.com/Gvolexe/GvolTools.git
            cd GvolTools
            ./installgvtools.sh install-all --deps
            ```

            **Arch Linux (AUR):**
            ```bash
            yay -S gvoltools
            # or
            yay -S gvoltools-git
            ```

            **Debian/Ubuntu:**
            ```bash
            # Download .deb from releases
            sudo dpkg -i gvoltools_${{ github.ref_name }}_all.deb
            sudo apt-get install -f
            ```

            ### Included Tools (${{ steps.changelog.outputs.tool_count }})

            | Tool | Description |
            |------|-------------|
            | **gv** | Help command and tool dispatcher |
            | **gvfleet** | Host inventory management |
            | **gvsshprofile** | SSH connection profiles |
            | **gvhostbootstrap** | Host security bootstrap |
            | **gvsshaudit** | SSH configuration auditing |
            | **gvknownhostsctl** | known_hosts management |
            | **gvsecretsync** | Encrypted secrets distribution |
            | **gvcertctl** | TLS certificate management |
            | **gvfirewallctl** | Firewall baseline management |
            | **gvupdates** | Security updates management |
            | **gvsudoauth** | Sudo authentication configuration |
            | **gvlogtriage** | Log analysis |
            | **gvbackupctl** | Backup with restic |
            | **gvdnscheck** | DNS validation |
            | **gvnetdiag** | Network diagnostics |
            | **gvportsentry** | Port scanning and baselines |
            | **gvdotctl** | Dotfile management |
            | **gvgitopsinit** | GitOps scaffolding |
            | **gvpermcheck** | Permission auditing |
            | **gvolkeymanager** | SSH key management |
            | **gvhealth** | Host and service health checks |
            | **gvmetrics** | Resource metrics collection |
            | **gvtcptest** | TCP connectivity testing |
            | **gvjournal** | Systemd journal log fetching |
            | **gvdeploy** | Command/script execution across hosts |
            | **gvsync** | Rsync wrapper with SSH profiles |
            | **gvsystemdctl** | Fleet-safe systemd management |
            | **gvrebootctl** | Safe reboot coordination |
            | **gvpolicy** | Fleet security policy rules |
            | **gvdnsprovider** | DNS provider credentials |
            | **gvconfigrender** | Template rendering and deployment |
            | **gvnginxctl** | Nginx config testing and management |

            ### Requirements

            - Python 3.10+
            - paramiko
            - cryptography

            ### Supported Distributions

            - Ubuntu 22.04+, Debian 11+
            - Fedora 39+, Rocky Linux 8+
            - Arch Linux, openSUSE

            See [documentation](docs/) for detailed usage.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Arch Linux Package Verification
  # ─────────────────────────────────────────────────────────────────────────────

  test-arch-package:
    name: Test Arch Package
    runs-on: ubuntu-latest
    needs: validate
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo python python-pip python-paramiko python-cryptography

      - name: Create build user
        run: |
          # makepkg cannot run as root, create a build user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Update PKGBUILD version
        run: |
          cd packaging/aur
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Build package
        run: |
          cd packaging/aur
          su builder -c "makepkg -sf --noconfirm"

      - name: Install package
        run: |
          cd packaging/aur
          pacman -U --noconfirm gvoltools-*.pkg.tar.zst

      - name: Verify all commands work
        run: |
          echo "Testing all gvoltools commands..."
          FAILED=0

          # Main entry point
          echo "Testing: gv --help"
          gv --help || { echo "FAIL: gv"; FAILED=1; }

          # All tool commands
          TOOLS="gvfleet gvsshprofile gvhostbootstrap gvsshaudit gvknownhostsctl gvsecretsync gvcertctl gvfirewallctl gvupdates gvsudoauth gvlogtriage gvbackupctl gvdnscheck gvnetdiag gvportsentry gvdotctl gvgitopsinit gvpermcheck gvolkeymanager gvhealth gvmetrics gvtcptest gvjournal gvdeploy gvsync gvsystemdctl gvrebootctl gvpolicy gvdnsprovider gvconfigrender gvnginxctl"

          for tool in $TOOLS; do
            echo "Testing: $tool --help"
            $tool --help || { echo "FAIL: $tool"; FAILED=1; }
          done

          # Test all aliases work (excluding su/backup which conflict with system commands)
          ALIASES="fleet f gvf sp gvsp hb gvhb sa sshaudit gvsa kh gvkh sec secrets gvs cert gvcert fw gvfw upd gvu sudoauth gvsu lt logtriage gvlt bk gvbk dns dc gvdns nd netdiag gvnd ports gvps dt dot gvdt gi gitops gvgi pc perm gvpc km gvkm health hl metrics mx tcp tc jrnl j dep run sync sx sd svc reboot rb pol pl dnsprov dp render rr ngx nx"

          for alias in $ALIASES; do
            echo "Testing alias: $alias --help"
            $alias --help || { echo "FAIL: $alias"; FAILED=1; }
          done

          if [ $FAILED -eq 1 ]; then
            echo "ERROR: Some commands failed!"
            exit 1
          fi

          echo "✓ All commands and aliases verified successfully!"

      - name: Test gv list and version
        run: |
          echo "Testing gv list..."
          gv list
          echo ""
          echo "Testing gv --version..."
          gv --version

  publish-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: [release, test-arch-package]
    # Only publish to AUR from main branch releases
    if: github.ref_type == 'tag' && github.event.base_ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          cd packaging/aur
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Prepare PKGBUILD for git package
        run: |
          # The AUR action expects a file named PKGBUILD
          # Copy PKGBUILD-git to a new location that will be used for gvoltools-git
          cp packaging/aur/PKGBUILD-git packaging/aur/PKGBUILD-git-deploy

      - name: Publish gvoltools to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: gvoltools
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: Gvol
          commit_email: gvol@nexusystems.org
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"

      - name: Publish gvoltools-git to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: gvoltools-git
          pkgbuild: ./packaging/aur/PKGBUILD-git-deploy
          commit_username: Gvol
          commit_email: gvol@nexusystems.org
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"
